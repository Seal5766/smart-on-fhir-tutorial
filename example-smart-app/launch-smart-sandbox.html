<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
    <!--
      Temporarily disable cerner-smart-embeddable-lib
      <link rel='stylesheet' type='text/css' href='./lib/css/cerner-smart-embeddable-lib-1.0.0.min.css'>
    -->
    <title>Example-SMART-App</title>
  </head>
  <body>
    <div id="loading" class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>
    <div id='errors'></div>
    <div id='holder' style="display:none;">
      <h2>Example-SMART-App</h2>

      <h2>Patient Resource</h2>
      <table>
        <tr>
          <th>First Name:</th>
          <td id='fname'></td>
        </tr>
        <tr>
          <th>Last Name:</th>
          <td id='lname'></td>
        </tr>
        <tr>
          <th>Gender:</th>
          <td id='gender'></td>
        </tr>
        <tr>
          <th>Date of Birth:</th>
          <td id='birthdate'></td>
        </tr>
      </table>
      <h2>Observation Resource</h2>
      <table>
        <tr>
          <th>Height:</th>
          <td id='height'></td>
        </tr>
        <tr>
          <th>Systolic Blood Pressure:</th>
          <td id='systolicbp'></td>
        </tr>
        <tr>
          <th>Diastolic Blood Pressure:</th>
          <td id='diastolicbp'></td>
        </tr>
        <tr>
          <th>LDL:</th>
          <td id='ldl'></td>
        </tr>
        <tr>
          <th>HDL:</th>
          <td id='hdl'></td>
        </tr>
      </table>
    </div>

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>

    <!-- Application-level javascript-->
    <script src='./src/js/example-smart-app.js'></script>

    <!-- FHIR Client JS Library - Updated to R4 compatible version -->
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>

    <!-- Initialize FHIR client after library is loaded -->
    <script>
      // Wait for FHIR library to load
      function initFHIR() {
        if (typeof FHIR === 'undefined' || !FHIR.oauth2) {
          console.log('FHIR library not loaded yet, retrying...');
          setTimeout(initFHIR, 100);
          return;
        }

        console.log('FHIR library loaded successfully');

        // Initialize FHIR client for SMART launch
        FHIR.oauth2.init({
          iss: sessionStorage.iss,
          launch: sessionStorage.launch
        }).then(function(client) {
          console.log('FHIR client initialized');
          // Call extractData with the initialized client
          extractData(client).then(
            //Display Patient Demographics and Observations if extractData was success
            function(p) {
              drawVisualization(p);
            },

            //Display 'Failed to call FHIR Service' if extractData failed
            function(err) {
              console.error('Error:', err);
              $('#loading').hide();
              $('#errors').html('<p> Failed to call FHIR Service </p>');
            }
          );
        }).catch(function(err) {
          console.error('FHIR Init Error:', err);
          $('#loading').hide();
          $('#errors').html('<p> Failed to initialize FHIR client: ' + err.message + '</p>');
        });
      }

      // Start initialization when DOM is ready
      document.addEventListener('DOMContentLoaded', initFHIR);
      
      // Also try immediately in case it's already loaded
      setTimeout(initFHIR, 10);
    </script>
  </body>
</html>
